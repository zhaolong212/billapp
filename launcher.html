<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>正在加载最新词汇...</title>
<style>
  body { margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; background: #f5f6f8; font-family: sans-serif; flex-direction: column; color: #4a7dff;}
  .spinner { border: 4px solid #eef1f6; border-top: 4px solid #4a7dff; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin-bottom: 20px;}
  @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="spinner"></div>
  <div id="status">正在检查更新...</div>

<script>
  // ⚠️ 请把你最终上传到 GitHub 的 app.html 的真实链接填在这里！
  // 例如：https://zhaolong212.github.io/billapp/app.html
  var REAL_APP_URL = 'https://zhaolong212.github.io/billapp/app.html'; 
  
  var CACHE_KEY = 'my_app_html_cache';

  function loadApp() {
    var xhr = new XMLHttpRequest();
    // 加时间戳，强制获取最新代码
    xhr.open('GET', REAL_APP_URL + '?t=' + Date.now()); 
    xhr.onload = function() {
      if (xhr.status === 200) {
        var html = xhr.responseText;
        // 1. 保存到手机本地（离线备用）
        localStorage.setItem(CACHE_KEY, html);
        // 2. 渲染出来
        render(html);
      } else {
        fallback();
      }
    };
    xhr.onerror = function() { fallback(); };
    xhr.timeout = 3000; 
    xhr.ontimeout = function() { fallback(); };
    xhr.send();
  }

  function fallback() {
    // 网络断开或拉取失败时，读取上一次的缓存
    var cached = localStorage.getItem(CACHE_KEY);
    if (cached) {
      document.getElementById('status').innerText = '网络不可用，正在进入离线版...';
      render(cached);
    } else {
      document.getElementById('status').innerText = '首次打开需要网络，请检查网络后重新打开。';
    }
  }

  function render(html) {
    document.open();
    document.write(html);
    document.close();
  }

  loadApp();
</script>
</body>
</html>
